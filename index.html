        function viewImage(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalCounter = document.getElementById('modalCounter');
            const chapter = chapters[currentChapter];
            
            // Find the index of the current image
            currentImageIndex = chapter.questions.findIndex(q => q.image === imageSrc);
            
            modalImage.src = imageSrc;
            modalCounter.textContent = `Question ${currentImageIndex + 1} of ${chapter.questions.length}`;
            modal.classList.add('active');
            
            modal.onclick = (e) => {
                if (e.target === modal) {
                    closeImageModal();
                }
            };
            
            // Add keyboard navigation
            document.addEventListener('keydown', handleImageNavigation);
        }
        
        function navigateImage(direction) {
            if (currentImageIndex === -1 || currentChapter === null) return;
            
            const chapter = chapters[currentChapter];
            const modalImage = document.getElementById('modalImage');
            const modalCounter = document.getElementById('modalCounter');
            
            // Calculate new index with wrapping
            currentImageIndex = (currentImageIndex + direction + chapter.questions.length) % chapter.questions.length;
            
            // Update image and counter
            modalImage.src = chapter.questions[currentImageIndex].image;
            modalCounter.textContent = `Question ${currentImageIndex + 1} of ${chapter.questions.length}`;
        }
        
        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
            currentImageIndex = -1;
            document.removeEventListener('keydown', handleImageNavigation);
        }
        
        function handleImageNavigation(e) {
            if (currentImageIndex === -1 || currentChapter === null) return;
            
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                navigateImage(1); // Next image
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                navigateImage(-1); // Previous image
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeImageModal();
            }
        }
        
        async function exportPDF() {
            const chapter = chapters[currentChapter];
            
            if (chapter.questions.length === 0) {
                showToast('No questions to export!', 'error');
                return;
            }
            
            showToast('Generating PDF...', 'info');
            
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const margin = 20;
            const contentWidth = pageWidth - (2 * margin);
            
            // Title page with better design
            pdf.setFillColor(79, 70, 229);
            pdf.rect(0, 0, pageWidth, 60, 'F');
            
            pdf.setTextColor(255, 255, 255);
            pdf.setFontSize(28);
            pdf.setFont(undefined, 'bold');
            pdf.text(chapter.name, pageWidth / 2, 35, { align: 'center' });
            
            pdf.setFontSize(12);
            pdf.setFont(undefined, 'normal');
            pdf.text(`${chapter.questions.length} Questions`, pageWidth / 2, 48, { align: 'center' });
            
            pdf.setTextColor(100, 100, 100);
            pdf.setFontSize(9);
            pdf.text(`Generated on ${new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}`, pageWidth / 2, 75, { align: 'center' });
            
            // Author credit on title page
            pdf.setFontSize(8);
            pdf.setTextColor(150, 150, 150);
            pdf.text('Created with Lecture Notes Manager', pageWidth / 2, pageHeight - 25, { align: 'center' });
            pdf.setFontSize(9);
            pdf.setTextColor(79, 70, 229);
            pdf.text('by Gourav Saini (Hiroshi)', pageWidth / 2, pageHeight - 18, { align: 'center' });
            
            // Start questions on new page
            pdf.addPage();
            
            let currentY = margin;
            const questionSpacing = 8;
            const imageMaxHeight = 100; // Maximum height for each image in mm
            
            for (let i = 0; i < chapter.questions.length; i++) {
                const img = new Image();
                img.src = chapter.questions[i].image;
                
                await new Promise((resolve) => {
                    img.onload = () => {
                        // Calculate image dimensions
                        const imgWidth = img.width;
                        const imgHeight = img.height;
                        const aspectRatio = imgWidth / imgHeight;
                        
                        // Calculate final dimensions
                        let finalWidth = contentWidth;
                        let finalHeight = finalWidth / aspectRatio;
                        
                        // If height is too much, scale down based on height
                        if (finalHeight > imageMaxHeight) {
                            finalHeight = imageMaxHeight;
                            finalWidth = finalHeight * aspectRatio;
                        }
                        
                        const questionNumberHeight = 12;
                        const totalHeight = questionNumberHeight + finalHeight + questionSpacing;
                        
                        // Check if we need a new page
                        if (currentY + totalHeight > pageHeight - margin) {
                            pdf.addPage();
                            currentY = margin;
                        }
                        
                        // Add question number with background
                        pdf.setFillColor(79, 70, 229);
                        pdf.roundedRect(margin, currentY, 20, 8, 2, 2, 'F');
                        pdf.setTextColor(255, 255, 255);
                        pdf.setFontSize(10);
                        pdf.setFont(undefined, 'bold');
                        pdf.text(`Q${i + 1}`, margin + 10, currentY + 5.5, { align: 'center' });
                        
                        // Add image with border
                        const imageX = margin + (contentWidth - finalWidth) / 2;
                        const imageY = currentY + questionNumberHeight;
                        
                        // Add subtle border around image
                        pdf.setDrawColor(230, 230, 230);
                        pdf.setLineWidth(0.5);
                        pdf.rect(imageX - 2, imageY - 2, finalWidth + 4, finalHeight + 4);
                        
                        pdf.addImage(img, 'JPEG', imageX, imageY, finalWidth, finalHeight);
                        
                        currentY += totalHeight;
                        
                        // Add a separator line between questions (except after last question)
                        if (i < chapter.questions.length - 1 && currentY < pageHeight - margin - 20) {
                            pdf.setDrawColor(220, 220, 220);
                            pdf.setLineWidth(0.3);
                            pdf.line(margin + 10, currentY - questionSpacing/2, pageWidth - margin - 10, currentY - questionSpacing/2);
                        }
                        
                        resolve();
                    };
                    
                    img.onerror = () => {
                        console.error(`Failed to load image ${i + 1}`);
                        resolve();
                    };
                });
            }
            
            // Add page numbers to all pages except title page
            const totalPages = pdf.internal.getNumberOfPages();
            pdf.setFontSize(9);
            pdf.setTextColor(150, 150, 150);
            
            for (let i = 2; i <= totalPages; i++) {
                pdf.setPage(i);
                pdf.text(`Page ${i - 1} of ${totalPages - 1}`, pageWidth / 2, pageHeight - 10, { align: 'center' });
            }
            
            pdf.save(`${chapter.name.replace(/[^a-z0-9]/gi, '_')}_${Date.now()}.pdf`);
            showToast('PDF successfully downloaded!', 'success');
        }
        
        function showToast(message, type = 'success') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            let icon = '';
            if (type === 'success') {
                icon = '<svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
            } else if (type === 'error') {
                icon = '<svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
            } else {
                icon = '<svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
            }
            
            toast.innerHTML = icon + '<span>' + message + '</span>';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        // Initialize
        initializeData();
        renderChapters();
        
        // Set auto-sync checkbox state
        const autoSyncToggle = document.getElementById('autoSyncToggle');
        if (autoSyncToggle) {
            autoSyncToggle.checked = autoSyncEnabled;
        }
        
        // Initial status check
        setTimeout(checkAutoSyncStatus, 2000);
        
        // Enter key support
        document.getElementById('chapterInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addChapter();
            }
        });
    </script>
